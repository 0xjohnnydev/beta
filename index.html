<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0xjohnny Beta Repo</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f14; --card:#161a22; --fg:#e8eaf0; --muted:#9aa4b2; --accent:#6b8aed; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { max-width:680px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:1.9rem; margin:0 0 .25em; }
  .tag { display:inline-block; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:2px 10px; margin-bottom:14px; }
  p { color:var(--muted); }
  .card { background:var(--card); border-radius:14px; padding:20px; margin:22px 0; }
  code { background:#0b0d12; padding:2px 6px; border-radius:6px; font-size:.9em; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; padding:12px 18px; border-radius:12px; margin-top:6px; }
  .muted { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Beta</span>
    <h1>0xjohnny Beta Repo</h1>
    <p>Staging repository for in-development tweaks. Packages here may be unstable.</p>

    <div class="card">
      <strong>Add to Sileo / Zebra</strong>
      <p class="muted">Use this URL as the repo source:</p>
      <code>https://0xjohnnydev.github.io/beta/</code>
      <div><a class="btn" href="sileo://source/https://0xjohnnydev.github.io/beta/">Add to Sileo</a></div>
    </div>

    <p class="muted">Signed with GPG key <code>766E4907CF271B91</code> &middot; public key at <code>repo.gpg</code>.</p>
  </div>
</body>
</html>
